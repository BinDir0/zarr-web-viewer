server:
  host: 127.0.0.1
  port: 9481
  debug: false

paths:
  mediapipe_repo_root: /root/mediapipe
  manopth_root: /root/manopth
  mano_models_root: /root/manopth/mano/models

review:
  max_candidate_chains: 4
  clip_context_frames: 60
  clip_merge_gap: 15
  max_clip_frames: 240
  overlap_frames: 30
  preview_width: 640
  frame_stride_for_cards: 3

pipeline:
  detector_backend: mediapipe
  min_detection_confidence: 0.35
  min_presence_confidence: 0.35
  min_tracking_confidence: 0.35
  max_hands: 4
  track_max_gap: 2
  chain_merge_gap: 5
  min_chain_frames: 5
  top_k_chains: 4

fit:
  enable_mano: true
  device: cpu
  stage1_steps: 80
  stage2_steps: 150
  stage3_steps: 200
  learning_rate: 0.03
  reprojection_weight: 5.0
  relative_3d_weight: 2.0
  temporal_weight: 0.05
  shape_weight: 0.001
  pose_prior_weight: 0.001

mano:
  use_pca: true
  ncomps: 15
  center_idx: 0
  flat_hand_mean: true

export:
  target_name: hard_hand_clips.zarr
  min_valid_ratio: 0.7
  max_median_reproj_error_px: 18.0
  max_p95_reproj_error_px: 40.0
