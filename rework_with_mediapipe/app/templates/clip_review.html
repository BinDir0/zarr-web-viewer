<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Clip Review</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='styles.css') }}">
  </head>
  <body>
    <div id="app" data-clip-id="{{ clip_id }}">
      <header class="page-header">
        <a class="secondary-link" href="{{ url_for('index') }}">返回首页</a>
        <div id="title">Loading clip {{ clip_id }}...</div>
      </header>
      <main class="review-layout">
        <section class="player-panel">
          <div class="viewer-shell">
            <img id="frame-image" alt="frame">
            <canvas id="overlay-canvas"></canvas>
          </div>
          <div class="playback-row">
            <button id="play-toggle" class="primary-btn">播放</button>
            <input id="frame-slider" type="range" min="0" max="0" value="0">
            <span id="frame-label">0 / 0</span>
          </div>
        </section>
        <aside class="side-panel">
          <section class="question-card">
            <h2>佩戴者左手</h2>
            <div id="left-choices"></div>
          </section>
          <section class="question-card">
            <h2>佩戴者右手</h2>
            <div id="right-choices"></div>
          </section>
          <section class="question-card">
            <h2>候选轨迹</h2>
            <div id="candidate-cards" class="candidate-list"></div>
          </section>
          <section id="merge-card" class="question-card hidden">
            <h2>补充问题</h2>
            <div id="merge-questions"></div>
          </section>
          <section class="question-card">
            <label for="review-confidence">审核置信度</label>
            <select id="review-confidence">
              <option value="high">high</option>
              <option value="normal" selected>normal</option>
              <option value="low">low</option>
            </select>
            <button id="submit-review" class="primary-btn full-width">提交</button>
            <div id="submit-message" class="meta-note"></div>
          </section>
        </aside>
      </main>
    </div>
    <script src="{{ url_for('static', filename='main.js') }}"></script>
  </body>
</html>
