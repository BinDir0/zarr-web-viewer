<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>MediaPipe Clip Review</title>
    <link rel="stylesheet" href="{{ url_for('mediapipe_review.static', filename='mediapipe_review.css') }}">
  </head>
  <body class="mpr-page">
    <div id="mpr-review-app" data-clip-id="{{ clip_id }}">
      <header class="mpr-header">
        <a class="mpr-link" href="{{ url_for('mediapipe_review.dashboard') }}">返回 Dashboard</a>
        <div id="mpr-title">Loading clip {{ clip_id }}...</div>
      </header>
      <main class="mpr-review-layout">
        <section class="mpr-player-card">
          <div class="mpr-viewer-shell">
            <img id="mpr-frame-image" alt="frame">
            <canvas id="mpr-overlay-canvas"></canvas>
          </div>
          <div class="mpr-playback-row">
            <button id="mpr-play-toggle" class="mpr-btn mpr-btn-primary">播放</button>
            <input id="mpr-frame-slider" type="range" min="0" max="0" value="0">
            <span id="mpr-frame-label">0 / 0</span>
          </div>
          <section class="mpr-focus-panel">
            <div id="mpr-focus-hint" class="mpr-meta-note">正在加载重点帧…</div>
            <div id="mpr-bad-frame-chips" class="mpr-inline"></div>
          </section>
        </section>
        <aside class="mpr-side-panel">
          <section class="mpr-card">
            <h2>审核规则</h2>
            <div class="mpr-instructions">
              <div><span class="mpr-inline-badge mpr-inline-badge-blue">Track</span> 蓝框是可选候选，编号全局固定。</div>
              <div><span class="mpr-inline-badge mpr-inline-badge-green">左手</span> 选给 wearer-left 后变绿。</div>
              <div><span class="mpr-inline-badge mpr-inline-badge-red">右手</span> 选给 wearer-right 后变红。</div>
              <div>不属于 wearer 的手直接忽略，不单独做别的标记。</div>
              <div>如果该侧手可见但 proposal 没给出可用框，请勾“该侧可见但缺框”。</div>
            </div>
          </section>
          <section class="mpr-card">
            <div class="mpr-side-head">
              <h2>佩戴者左手</h2>
              <button id="mpr-left-clear" class="mpr-btn mpr-btn-secondary" type="button">清空左手</button>
            </div>
            <div id="mpr-left-summary" class="mpr-selection-summary"></div>
            <label class="mpr-checkbox-row">
              <input id="mpr-left-missing-box" type="checkbox">
              <span>左手可见，但没有被 proposal 打上框</span>
            </label>
          </section>
          <section class="mpr-card">
            <div class="mpr-side-head">
              <h2>佩戴者右手</h2>
              <button id="mpr-right-clear" class="mpr-btn mpr-btn-secondary" type="button">清空右手</button>
            </div>
            <div id="mpr-right-summary" class="mpr-selection-summary"></div>
            <label class="mpr-checkbox-row">
              <input id="mpr-right-missing-box" type="checkbox">
              <span>右手可见，但没有被 proposal 打上框</span>
            </label>
          </section>
          <section class="mpr-card">
            <h2>候选 Track</h2>
            <div id="mpr-candidate-cards" class="mpr-candidate-list"></div>
          </section>
          <section class="mpr-card">
            <button id="mpr-submit-review" class="mpr-btn mpr-btn-primary mpr-full-width">提交</button>
            <div id="mpr-submit-message" class="mpr-meta-note"></div>
          </section>
        </aside>
      </main>
    </div>
    <script src="{{ url_for('mediapipe_review.static', filename='mediapipe_review.js') }}"></script>
  </body>
</html>
