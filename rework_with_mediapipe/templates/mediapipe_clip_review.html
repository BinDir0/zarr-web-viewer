<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>YOLO Episode Review</title>
    <link rel="stylesheet" href="{{ url_for('mediapipe_review.static', filename='mediapipe_review.css') }}">
  </head>
  <body class="mpr-page">
    <div id="mpr-review-app" data-clip-id="{{ clip_id }}" data-start-rank="{{ start_rank }}">
      <header class="mpr-header">
        <a class="mpr-link" href="{{ url_for('mediapipe_review.dashboard', start_rank=start_rank) }}">返回 Dashboard</a>
        <div class="mpr-header-copy">
          <div id="mpr-title">Loading episode {{ clip_id }}...</div>
          <div id="mpr-subtitle" class="mpr-meta-note"></div>
        </div>
      </header>
      <main class="mpr-review-shell">
        <section class="mpr-player-card">
          <div class="mpr-review-topbar">
            <div class="mpr-inline">
              <button id="mpr-prev-keyframe" class="mpr-btn mpr-btn-secondary" type="button">上一关键帧</button>
              <button id="mpr-next-keyframe" class="mpr-btn mpr-btn-secondary" type="button">下一关键帧</button>
            </div>
            <div>
              <div id="mpr-keyframe-label" class="mpr-keyframe-title"></div>
              <div id="mpr-keyframe-reasons" class="mpr-meta-note"></div>
            </div>
            <div id="mpr-keyframe-status" class="mpr-keyframe-state"></div>
          </div>

          <div class="mpr-viewer-shell">
            <img id="mpr-frame-image" alt="frame">
            <canvas id="mpr-overlay-canvas"></canvas>
          </div>

          <section class="mpr-review-controls">
            <div id="mpr-viewer-hint" class="mpr-meta-note">
              左键点框=左手；右键点框=右手；`1/2` 进入手动画框；`Q/E`=不可见；`A/D`=不可用；`←/→` 切换审核帧。
            </div>
            <div class="mpr-side-action-grid">
              <section class="mpr-side-action-card">
                <div class="mpr-side-action-title">左手</div>
                <div class="mpr-inline">
                  <button id="mpr-left-not-visible" class="mpr-btn mpr-btn-secondary" type="button">不可见</button>
                  <button id="mpr-left-unusable" class="mpr-btn mpr-btn-secondary" type="button">不可用</button>
                  <button id="mpr-left-manual-box" class="mpr-btn mpr-btn-secondary" type="button">手动画框</button>
                </div>
              </section>
              <section class="mpr-side-action-card">
                <div class="mpr-side-action-title">右手</div>
                <div class="mpr-inline">
                  <button id="mpr-right-not-visible" class="mpr-btn mpr-btn-secondary" type="button">不可见</button>
                  <button id="mpr-right-unusable" class="mpr-btn mpr-btn-secondary" type="button">不可用</button>
                  <button id="mpr-right-manual-box" class="mpr-btn mpr-btn-secondary" type="button">手动画框</button>
                </div>
              </section>
            </div>
            <div id="mpr-draw-status" class="mpr-meta-note"></div>
            <div id="mpr-assignment-summary" class="mpr-selection-summary"></div>
          </section>

          <section class="mpr-card mpr-submit-card">
            <button id="mpr-submit-review" class="mpr-btn mpr-btn-primary" type="button">提交整条 Episode</button>
            <div id="mpr-submit-message" class="mpr-meta-note"></div>
          </section>
        </section>

        <section class="mpr-card mpr-nav-card">
          <div class="mpr-strip-head">
            <h2>导航</h2>
            <div id="mpr-strip-summary" class="mpr-meta-note"></div>
          </div>
          <div class="mpr-jump-row">
            <label class="mpr-jump-label" for="mpr-episode-rank-input">跳到第 N 条可审核 Episode</label>
            <input id="mpr-episode-rank-input" class="mpr-rank-input mpr-jump-input" type="number" min="1" step="1" value="{{ start_rank }}">
            <button id="mpr-episode-rank-go" class="mpr-btn mpr-btn-secondary" type="button">打开</button>
          </div>
          <div id="mpr-episode-jump-status" class="mpr-meta-note">按当前 ready_for_review 队列排序；例如第 2 条会跳到第二个可审核 clip。</div>
          <div class="mpr-jump-row">
            <label class="mpr-jump-label" for="mpr-jump-input">跳到审核帧</label>
            <input id="mpr-jump-input" class="mpr-rank-input mpr-jump-input" type="number" min="1" step="1" value="1">
            <button id="mpr-jump-go" class="mpr-btn mpr-btn-secondary" type="button">跳转</button>
          </div>
          <div class="mpr-meta-note">这里只按审核帧序号跳转，不按原始 frame 号跳。</div>
        </section>
      </main>
    </div>
    <script src="{{ url_for('mediapipe_review.static', filename='mediapipe_review.js') }}"></script>
  </body>
</html>
