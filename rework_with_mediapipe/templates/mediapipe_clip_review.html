<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>MediaPipe Clip Review</title>
    <link rel="stylesheet" href="{{ url_for('mediapipe_review.static', filename='mediapipe_review.css') }}">
  </head>
  <body class="mpr-page">
    <div id="mpr-review-app" data-clip-id="{{ clip_id }}">
      <header class="mpr-header">
        <a class="mpr-link" href="{{ url_for('mediapipe_review.dashboard') }}">返回 Dashboard</a>
        <div class="mpr-header-copy">
          <div id="mpr-title">Loading clip {{ clip_id }}...</div>
          <div id="mpr-subtitle" class="mpr-meta-note"></div>
        </div>
      </header>
      <main class="mpr-review-shell">
        <section class="mpr-player-card">
          <div class="mpr-review-topbar">
            <div class="mpr-inline">
              <button id="mpr-prev-keyframe" class="mpr-btn mpr-btn-secondary" type="button">上一关键帧</button>
              <button id="mpr-next-keyframe" class="mpr-btn mpr-btn-secondary" type="button">下一关键帧</button>
            </div>
            <div>
              <div id="mpr-keyframe-label" class="mpr-keyframe-title"></div>
              <div id="mpr-keyframe-reasons" class="mpr-meta-note"></div>
            </div>
            <div id="mpr-keyframe-status" class="mpr-keyframe-state"></div>
          </div>

          <div class="mpr-viewer-shell">
            <img id="mpr-frame-image" alt="frame">
            <canvas id="mpr-overlay-canvas"></canvas>
          </div>

          <section class="mpr-review-controls">
            <div id="mpr-viewer-hint" class="mpr-meta-note">
              左键点框=wearer 左手；右键点框=wearer 右手；再次点同侧可清空。页面只显示关键帧。
            </div>
            <div class="mpr-inline">
              <label class="mpr-checkbox-row">
                <input id="mpr-left-missing-box" type="checkbox">
                <span>左手可见但没框</span>
              </label>
              <label class="mpr-checkbox-row">
                <input id="mpr-right-missing-box" type="checkbox">
                <span>右手可见但没框</span>
              </label>
            </div>
            <div class="mpr-inline">
              <button id="mpr-clear-left" class="mpr-btn mpr-btn-secondary" type="button">清空左手</button>
              <button id="mpr-clear-right" class="mpr-btn mpr-btn-secondary" type="button">清空右手</button>
              <button id="mpr-confirm-keyframe" class="mpr-btn mpr-btn-primary" type="button">确认当前关键帧</button>
            </div>
            <div id="mpr-assignment-summary" class="mpr-selection-summary"></div>
          </section>

          <section class="mpr-card mpr-submit-card">
            <button id="mpr-submit-review" class="mpr-btn mpr-btn-primary" type="button">提交整条 Clip</button>
            <div id="mpr-submit-message" class="mpr-meta-note"></div>
          </section>
        </section>

        <section class="mpr-card">
          <div class="mpr-strip-head">
            <h2>关键帧</h2>
            <div id="mpr-strip-summary" class="mpr-meta-note"></div>
          </div>
          <div id="mpr-keyframe-list" class="mpr-keyframe-list"></div>
        </section>
      </main>
    </div>
    <script src="{{ url_for('mediapipe_review.static', filename='mediapipe_review.js') }}"></script>
  </body>
</html>
