<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>100K Dataset Sanity Check</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            background: #1a1a1a;
            color: #e0e0e0;
            padding: 20px;
        }

        .header {
            text-align: center;
            margin-bottom: 30px;
            padding: 20px;
            background: #2a2a2a;
            border-radius: 8px;
        }

        .header h1 {
            font-size: 28px;
            margin-bottom: 10px;
        }

        .header .stats {
            font-size: 14px;
            color: #888;
            margin-top: 10px;
        }

        .controls {
            background: #2a2a2a;
            padding: 30px;
            margin-top: 30px;
            border-radius: 8px;
            display: flex;
            justify-content: center;
            gap: 15px;
            max-width: 1400px;
            margin-left: auto;
            margin-right: auto;
            margin-bottom: 30px;
        }

        .btn {
            padding: 15px 35px;
            background: #007bff;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-size: 16px;
            font-weight: bold;
            transition: all 0.3s;
            min-width: 200px;
        }

        .btn:hover:not(:disabled) {
            transform: translateY(-2px);
            box-shadow: 0 4px 8px rgba(0,0,0,0.3);
        }

        .btn.danger {
            background: #6c757d;
        }

        .btn.danger:hover:not(:disabled) {
            background: #5a6268;
        }

        .btn.success {
            background: #28a745;
        }

        .btn.success:hover:not(:disabled) {
            background: #1e7e34;
        }

        .btn:disabled {
            background: #555;
            cursor: not-allowed;
            opacity: 0.5;
            transform: none;
        }

        .loading {
            text-align: center;
            padding: 40px;
            font-size: 18px;
        }

        .episodes-grid {
            width: 100%;
            padding: 15px;
            margin: 0;
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 15px;
            box-sizing: border-box;
        }

        .episodes-grid.frame-mode {
            grid-template-columns: repeat(5, minmax(0, 1fr));
        }

        .episode-block {
            background: #2a2a2a;
            border-radius: 8px;
            padding: 12px;
        }

        .episode-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
            padding-bottom: 8px;
            border-bottom: 1px solid #444;
        }

        .episode-title {
            font-size: 14px;
            font-weight: bold;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .dataset-badge {
            background: #007bff;
            color: white;
            padding: 3px 10px;
            border-radius: 10px;
            font-size: 11px;
            margin-right: 8px;
        }

        .episode-info {
            font-size: 11px;
            color: #888;
            white-space: nowrap;
        }

        .frame-card {
            background: #2a2a2a;
            border-radius: 8px;
            padding: 10px;
            border: 2px solid transparent;
        }

        .frame-card.annotated.alright {
            border-color: #4CAF50;
            box-shadow: 0 0 10px rgba(76, 175, 80, 0.22);
        }

        .frame-card.annotated.bad {
            border-color: #f44336;
            box-shadow: 0 0 10px rgba(244, 67, 54, 0.22);
        }

        .frame-card-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 10px;
            margin-bottom: 8px;
        }

        .frame-card-title {
            font-size: 12px;
            font-weight: 700;
            min-width: 0;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .frame-card-meta {
            font-size: 11px;
            color: #8c96a3;
            white-space: nowrap;
        }

        .frame-card-footer {
            margin-top: 8px;
            font-size: 11px;
            color: #8c96a3;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .annotation-status {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            padding: 6px 12px;
            font-size: 12px;
            font-weight: bold;
            text-align: center;
            border-radius: 8px 8px 0 0;
            z-index: 10;
        }

        .annotation-status.alright {
            background: linear-gradient(135deg, #4CAF50, #45a049);
            color: white;
        }

        .annotation-status.bad {
            background: linear-gradient(135deg, #f44336, #e53935);
            color: white;
        }

        .episode-block.annotated {
            position: relative;
            padding-top: 40px; /* 为标签留出空间 */
        }

        .episode-block.annotated.alright {
            border: 2px solid #4CAF50;
            box-shadow: 0 0 10px rgba(76, 175, 80, 0.3);
        }

        .episode-block.annotated.bad {
            border: 2px solid #f44336;
            box-shadow: 0 0 10px rgba(244, 67, 54, 0.3);
        }

        .episode-block.stage1-pending {
            border: 2px dashed #FF9800;
            opacity: 0.6;
        }

        .stage1-pending-label {
            padding: 20px 12px;
            text-align: center;
            color: #FF9800;
            font-size: 0.9rem;
            font-weight: 500;
        }

        .frames-container {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 8px;
            width: 100%;
        }

        .frame-wrapper {
            position: relative;
            cursor: pointer;
            border-radius: 8px;
            overflow: hidden;
            background: #1a1a1a;
            border: 2px solid transparent;
            transition: border-color 0.15s, box-shadow 0.15s;
        }

        .frame-wrapper:hover {
            border-color: rgba(255, 255, 255, 0.12);
        }

        .frame-wrapper img {
            width: 100%;
            height: auto;
            display: block;
            transition: transform 0.2s;
        }

        .frame-wrapper:hover img {
            transform: scale(1.02);
        }

        .frame-mask {
            position: absolute;
            inset: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 10px;
            text-align: center;
            z-index: 2;
            pointer-events: none;
        }

        .frame-mask-label {
            font-size: 13px;
            font-weight: 700;
            line-height: 1.35;
            text-shadow: 0 1px 3px rgba(0, 0, 0, 0.9);
            padding: 8px 10px;
            border-radius: 6px;
            max-width: 95%;
        }

        .frame-wrapper.state-ok .frame-mask {
            display: none;
        }

        .frame-wrapper.state-missing_annotation .frame-mask {
            background: rgba(176, 115, 28, 0.58);
        }

        .frame-wrapper.state-missing_annotation .frame-mask-label {
            color: #fff7f0;
            background: rgba(118, 76, 16, 0.55);
            border: 1px solid rgba(255, 200, 160, 0.35);
        }

        .frame-wrapper.state-non_visible_wrong_annotation .frame-mask {
            background: rgba(75, 50, 130, 0.55);
        }

        .frame-wrapper.state-non_visible_wrong_annotation .frame-mask-label {
            color: #f3ecff;
            background: rgba(55, 35, 95, 0.55);
            border: 1px solid rgba(200, 170, 255, 0.35);
        }

        .frame-wrapper.state-visible_box_wrong_annotation .frame-mask {
            background: rgba(145, 42, 42, 0.55);
        }

        .frame-wrapper.state-visible_box_wrong_annotation .frame-mask-label {
            color: #fff2f2;
            background: rgba(110, 28, 28, 0.55);
            border: 1px solid rgba(255, 170, 170, 0.35);
        }

        .frame-index {
            position: absolute;
            top: 6px;
            left: 6px;
            background: rgba(0, 0, 0, 0.8);
            color: white;
            padding: 3px 6px;
            border-radius: 3px;
            font-size: 11px;
            z-index: 2;
        }

        .interaction-hint {
            color: #9aa4b2;
            font-size: 13px;
            text-align: center;
        }

        /* 响应式设计：小屏幕时调整列数 */
        @media (max-width: 1700px) {
            .episodes-grid.frame-mode {
                grid-template-columns: repeat(4, minmax(0, 1fr));
            }
        }

        @media (max-width: 1200px) {
            .episodes-grid {
                grid-template-columns: repeat(2, 1fr);
            }

            .episodes-grid.frame-mode {
                grid-template-columns: repeat(3, minmax(0, 1fr));
            }
        }
        
        @media (max-width: 800px) {
            .episodes-grid {
                grid-template-columns: 1fr;
            }

            .episodes-grid.frame-mode {
                grid-template-columns: repeat(2, minmax(0, 1fr));
            }
        }
    </style>
</head>
<body>
    <div class="header">
        <h1>100K Dataset Sanity Check</h1>
        <div class="stats">
            <span id="loadedCount">加载中...</span>
            <span id="preloadStatus" style="margin-left: 20px; color: #4CAF50; font-size: 0.9em;"></span>
        </div>
    </div>

    <div id="loading" class="loading" style="display: none;">
        正在加载数据...
    </div>

    <div id="episodesContainer" class="episodes-grid">
    </div>

    <div class="controls">
        <div style="display: flex; gap: 10px; align-items: center; margin-bottom: 15px;">
            <label for="startOffset" id="startOffsetLabel" style="font-weight: bold;">起始位置：</label>
            <input type="number" id="startOffset" min="0" step="1" 
                   placeholder="输入起始episode编号（例如: 0, 1000, 5000）"
                   style="padding: 8px; border-radius: 4px; border: 1px solid #555; background: #333; color: #fff; width: 300px;">
            <span id="totalEpisodesInfo" style="color: #888; font-size: 14px; margin-left: 5px;">（总共: 加载中...）</span>
            <button class="btn" id="setOffsetBtn" onclick="setStartOffset()" 
                    style="background: #2196F3;">设置并开始</button>
        </div>
        <button class="btn success" id="submitBtn" onclick="submitAndLoadNext()" disabled>
            提交并加载下一批
        </button>
        <button class="btn danger" id="submitExitBtn" onclick="submitAndExit()" disabled>
            提交并退出
        </button>
        <div class="interaction-hint">
            单击 = A（双手可见但缺少标注）；双击 = B（非双手可见且框标错）；三击 = C（双手可见但框标错）；四击或不点 = 正确
        </div>
    </div>

    <script src="/static/sanity_check.js?v=16"></script>
</body>
</html>
