<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>返工标注 · 历史问题 Episode</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            background: #141820;
            color: #e8eaed;
            padding: 20px;
        }

        .header {
            text-align: center;
            margin-bottom: 20px;
            padding: 20px 24px;
            background: #1e2430;
            border-radius: 10px;
            border: 1px solid #2a3344;
        }

        .header h1 {
            font-size: 26px;
            margin-bottom: 12px;
            font-weight: 600;
        }

        .hint-box {
            max-width: 920px;
            margin: 0 auto;
            text-align: left;
            font-size: 14px;
            line-height: 1.65;
            color: #aeb8c9;
            background: rgba(0, 0, 0, 0.25);
            padding: 14px 18px;
            border-radius: 8px;
            border-left: 4px solid #3d8bfd;
        }

        .hint-box strong {
            color: #e8eaed;
        }

        .legend {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 16px 28px;
            margin-top: 14px;
            font-size: 13px;
        }

        .legend span {
            display: inline-flex;
            align-items: center;
            gap: 8px;
        }

        .dot {
            width: 12px;
            height: 12px;
            border-radius: 3px;
        }

        .dot.ok { background: transparent; border: 2px solid #5cb85c; }
        .dot.bad { background: rgba(255, 140, 66, 0.85); }
        .dot.nc { background: rgba(138, 99, 210, 0.9); }

        .header .stats {
            font-size: 14px;
            color: #7d8a9e;
            margin-top: 14px;
        }

        .controls {
            background: #1e2430;
            padding: 24px;
            margin-top: 24px;
            border-radius: 10px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 12px;
            max-width: 1400px;
            margin-left: auto;
            margin-right: auto;
            margin-bottom: 24px;
            border: 1px solid #2a3344;
        }

        .btn {
            padding: 14px 32px;
            background: #3d8bfd;
            color: white;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-size: 15px;
            font-weight: 600;
            transition: transform 0.15s, box-shadow 0.15s;
            min-width: 200px;
        }

        .btn:hover:not(:disabled) {
            transform: translateY(-1px);
            box-shadow: 0 4px 14px rgba(61, 139, 253, 0.35);
        }

        .btn.danger { background: #5c6370; }
        .btn.danger:hover:not(:disabled) { background: #4a515c; }

        .btn.success { background: #2ea043; }
        .btn.success:hover:not(:disabled) { background: #238636; }

        .btn:disabled {
            background: #3d444d;
            cursor: not-allowed;
            opacity: 0.55;
            transform: none;
            box-shadow: none;
        }

        .loading {
            text-align: center;
            padding: 40px;
            font-size: 17px;
        }

        .episodes-grid {
            width: 100%;
            padding: 12px;
            margin: 0;
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 14px;
            box-sizing: border-box;
        }

        .episode-block {
            background: #1e2430;
            border-radius: 10px;
            padding: 12px;
            border: 1px solid #2a3344;
        }

        .episode-block.legacy-bad {
            border-color: rgba(255, 140, 66, 0.45);
            box-shadow: 0 0 0 1px rgba(255, 140, 66, 0.12);
        }

        .episode-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
            padding-bottom: 8px;
            border-bottom: 1px solid #2f3a4d;
        }

        .episode-title {
            font-size: 13px;
            font-weight: 600;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .dataset-badge {
            background: #3d8bfd;
            color: white;
            padding: 2px 8px;
            border-radius: 8px;
            font-size: 10px;
            margin-right: 6px;
        }

        .episode-info {
            font-size: 11px;
            color: #7d8a9e;
            white-space: nowrap;
        }

        .legacy-tag {
            font-size: 10px;
            color: #ffb366;
            margin-top: 4px;
        }

        .episode-block.stage1-pending {
            border-style: dashed;
            border-color: #d4a017;
            opacity: 0.75;
        }

        .stage1-pending-label {
            padding: 18px 10px;
            text-align: center;
            color: #e3b341;
            font-size: 0.88rem;
        }

        .frames-container {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 8px;
            width: 100%;
        }

        .frame-wrapper {
            position: relative;
            cursor: pointer;
            border-radius: 8px;
            overflow: hidden;
            background: #0d1117;
            border: 2px solid transparent;
            transition: border-color 0.15s, box-shadow 0.15s;
        }

        .frame-wrapper:hover {
            border-color: rgba(255, 255, 255, 0.12);
        }

        .frame-wrapper img {
            width: 100%;
            height: auto;
            display: block;
            vertical-align: middle;
        }

        .frame-index {
            position: absolute;
            top: 6px;
            left: 6px;
            background: rgba(0, 0, 0, 0.82);
            color: #fff;
            padding: 3px 7px;
            border-radius: 4px;
            font-size: 11px;
            z-index: 3;
            font-weight: 500;
        }

        .frame-mask {
            position: absolute;
            inset: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 10px;
            text-align: center;
            z-index: 2;
            pointer-events: none;
        }

        .frame-mask-label {
            font-size: 13px;
            font-weight: 700;
            line-height: 1.35;
            text-shadow: 0 1px 3px rgba(0, 0, 0, 0.9);
            padding: 8px 10px;
            border-radius: 6px;
            max-width: 95%;
        }

        .frame-wrapper.state-ok .frame-mask {
            display: none;
        }

        .frame-wrapper.state-bad_box .frame-mask {
            background: rgba(180, 75, 30, 0.58);
        }

        .frame-wrapper.state-bad_box .frame-mask-label {
            color: #fff7f0;
            background: rgba(120, 45, 12, 0.55);
            border: 1px solid rgba(255, 200, 160, 0.35);
        }

        .frame-wrapper.state-not_clear .frame-mask {
            background: rgba(75, 50, 130, 0.55);
        }

        .frame-wrapper.state-not_clear .frame-mask-label {
            color: #f3ecff;
            background: rgba(55, 35, 95, 0.55);
            border: 1px solid rgba(200, 170, 255, 0.35);
        }

        .summary {
            position: fixed;
            bottom: 20px;
            right: 20px;
            background: #1e2430;
            padding: 18px 20px;
            border-radius: 10px;
            box-shadow: 0 8px 28px rgba(0, 0, 0, 0.45);
            min-width: 220px;
            border: 1px solid #2a3344;
        }

        .summary h3 {
            margin-bottom: 12px;
            font-size: 15px;
            font-weight: 600;
        }

        .summary .stat {
            display: flex;
            justify-content: space-between;
            margin: 7px 0;
            font-size: 13px;
        }

        .summary .stat .value {
            font-weight: 700;
        }

        .summary .stat.ok .value { color: #56d364; }
        .summary .stat.bad .value { color: #ff9f5a; }
        .summary .stat.nc .value { color: #b89cff; }

        @media (max-width: 1200px) {
            .episodes-grid { grid-template-columns: repeat(2, 1fr); }
        }

        @media (max-width: 800px) {
            .episodes-grid { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>
    <div class="header">
        <h1>返工标注（仅历史标为「有问题」的 Episode）</h1>
        <div class="hint-box">
            <strong>操作尽量少：</strong>不用点 = 该帧<strong>正确</strong>。需要改时<strong>反复点击图片</strong>即可循环：
            <strong>正确 → 标注框错误 → 手部不清晰 → 正确</strong>。<br>
            遮罩上会显示说明文字，请按实际观感选择；本页只列出数据库里仍为「BAD_FRAMES」的条目，提交后写入新格式并从此队列移除。
        </div>
        <div class="legend">
            <span><i class="dot ok"></i> 无遮罩 = 正确</span>
            <span><i class="dot bad"></i> 橙遮罩 = 手部可见，框错</span>
            <span><i class="dot nc"></i> 紫遮罩 = 手部非清晰可见</span>
        </div>
        <div class="stats">
            <span id="loadedCount">加载中...</span>
            <span id="preloadStatus" style="margin-left: 20px; color: #56d364; font-size: 0.9em;"></span>
        </div>
    </div>

    <div id="loading" class="loading" style="display: none;">正在加载数据...</div>

    <div id="episodesContainer" class="episodes-grid"></div>

    <div class="controls">
        <div style="display: flex; flex-wrap: wrap; gap: 10px; align-items: center; justify-content: center;">
            <label for="startOffset" style="font-weight: 600;">本队列起始序号：</label>
            <input type="number" id="startOffset" min="0" step="1"
                   placeholder="待返工列表中的起点（0 起算）"
                   style="padding: 8px 10px; border-radius: 6px; border: 1px solid #3d4a5f; background: #0d1117; color: #e8eaed; width: 260px;">
            <span id="totalEpisodesInfo" style="color: #7d8a9e; font-size: 13px;">（待返工条数: …）</span>
            <button class="btn" id="setOffsetBtn" type="button" style="background: #388bfd;">设置并开始</button>
        </div>
        <div style="display: flex; flex-wrap: wrap; gap: 12px; justify-content: center;">
            <button class="btn success" id="submitBtn" type="button" disabled>提交并加载下一批</button>
            <button class="btn danger" id="submitExitBtn" type="button" disabled>提交并退出</button>
        </div>
    </div>

    <div class="summary">
        <h3>本批帧统计</h3>
        <div class="stat ok"><span>正确（未点）</span><span class="value" id="statOk">0</span></div>
        <div class="stat bad"><span>标注框错误</span><span class="value" id="statBadBox">0</span></div>
        <div class="stat nc"><span>手部不清晰</span><span class="value" id="statNotClear">0</span></div>
        <div class="stat" style="margin-top: 10px; padding-top: 8px; border-top: 1px solid #2a3344;">
            <span>Episode 数</span><span class="value" id="totalEpisodes">0</span>
        </div>
    </div>

    <script src="/static/rework_check.js?v=2"></script>
</body>
</html>
