# WebDataset factory 配置
factory_base: /share_data/guantianrui/datasets/Egocentric-100K/processed_v9_test_jpg
factory_start: 1
factory_end: 70
# factory_episode_cache_file: /home/guantianrui/zarr-web-viewer/.factory_episodes_cache_1_70.json
# 若配置了下面的 results.jsonl，sanity-check 页面将优先直接标注这批结果，而不是走 factory_start/end 扫描。
sanity_results_globs:
  - /share_data/zhangtingrui/webdataset_run_002/machines/machine*/results/*.results.jsonl
  - /share_data/zhangtingrui/webdataset_run_002/machines/machine_*/results/*.results.jsonl
sanity_results_max_frames_per_episode: 8
sanity_results_sample_every_n: 30
sanity_results_sample_seed: sanity-results-fixed-v1
sanity_results_prewarm_render_cache: true
sanity_results_background_prewarm_render_cache: true
sanity_results_priority_prewarm_frames: 1024
sanity_results_prewarm_batch_size: 256

# 旧 BuildAI 10k raw 数据集（用于 rework 合并旧 flaw 队列）
legacy_buildai_dataset_root: /share_data/lvjianan/datasets/BuildAI-processed
legacy_buildai_dataset_name: BuildAI-10k
# legacy_buildai_episode_cache_file: /share_data/lvjianan/datasets/BuildAI-processed/_vla_episodes_cache.json
# 100k flaw source DB；当前仓库本地 annotations.db 仅作为 REWORK_V1 输出/覆盖层
source_factory_annotations_db: /home/guantianrui/zarr-web-viewer-100k/zarr-web-viewer/annotations.db
legacy_buildai_annotations_db: /share_data/guantianrui/EgoYOLO/annotations.db

server_port: 9475
debug_mode: true
use_reloader: false

mediapipe_review:
  replace_home: true
  db_path: /home/guantianrui/rework-viewer/zarr-web-viewer/mediapipe_review.db
  artifacts_dir: /home/guantianrui/rework-viewer/zarr-web-viewer/mediapipe_review_artifacts
  source_annotations_db: /home/guantianrui/zarr-flaw-viewer/zarr-web-viewer/annotations.db
  source_config_path: /home/guantianrui/rework-viewer/zarr-web-viewer/config.yaml
  prefer_installed_ultralytics: false
  ultralytics_repo_root: /share_data/guantianrui/ultralytics
  yolo_model_path: /share_data/guantianrui/HaWoR/weights/external/detector.pt
  yolo_tracker_config: botsort.yaml
  yolo_device: ""
  yolo_confidence: 0.05
  yolo_iou: 0.60
  yolo_max_det: 6
  yolo_imgsz: 1280
  yolo_predict_batch_size: 32
  hand_landmarker_task: /share_data/guantianrui/mediapipe/hand_landmarker.task
  mediapipe_repo_root: /share_data/guantianrui/mediapipe
  manopth_root: /share_data/guantianrui/manopth
  mano_models_root: /share_data/guantianrui/manopth/mano/models
  clip_context_frames: 60
  clip_merge_gap: 15
  max_clip_frames: 240
  overlap_frames: 30
  preview_width: 640
  frame_stride_for_cards: 3
  detector_max_hands: 6
  min_detection_confidence: 0.10
  min_presence_confidence: 0.10
  min_tracking_confidence: 0.10
  track_max_gap: 2
  min_chain_frames: 5
  top_k_chains: 4
  fit_device: cpu
  fit_stage1_steps: 80
  fit_stage2_steps: 150
  fit_stage3_steps: 200
  fit_learning_rate: 0.03
  fit_reprojection_weight: 5.0
  fit_relative_3d_weight: 2.0
  fit_temporal_weight: 0.05
  fit_shape_weight: 0.001
  fit_pose_prior_weight: 0.001
  mano_use_pca: true
  mano_ncomps: 15
  mano_center_idx: 0
  mano_flat_hand_mean: true
  max_median_reproj_error_px: 18.0
  max_p95_reproj_error_px: 40.0
